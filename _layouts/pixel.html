<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: page.title }}">
    <link rel="stylesheet" href="{{ '/assets/pixel.css' | relative_url }}">
  </head>
  <body>
    <div class="page-bg"></div>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-dot"></span>
          <span class="brand-text">CODEX COMPUTER USE</span>
        </div>
        <a class="topbar-link" href="https://github.com/Maynor996/codex-computer-use-guide">GitHub Repo</a>
      </header>

      <main class="layout-grid">
        <aside class="sidebar">
          <div class="pixel-card">
            <div class="pixel-card-label">Guide</div>
            <h2>像素风安装指北</h2>
            <p>4 步开启 Codex Computer Use，少走弯路，直接避坑。</p>
          </div>

          <div class="pixel-card">
            <div class="pixel-card-label">Quick Facts</div>
            <ul class="status-list">
              <li><span>插件安装</span><strong>10-20 秒</strong></li>
              <li><span>核心权限</span><strong>2 个</strong></li>
              <li><span>最大坑点</span><strong>找不到 helper</strong></li>
            </ul>
          </div>

          <div class="pixel-card cta-card">
            <div class="pixel-card-label">Codex</div>
            <p>如果你要直接上手，也可以从这里开通。</p>
            <a class="pixel-button" href="https://momoai.czvip.cn/products/m13">每天 150 刀额度</a>
          </div>
        </aside>

        <article class="content-frame">
          <div class="content-chrome">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="content-body">
            {{ content }}
          </div>
        </article>
      </main>
    </div>
  </body>
</html>
